spring:
  application:
    name: pontegames-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

server:
  port: 8080
