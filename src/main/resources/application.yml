spring:
  profiles:
    active: local
  application:
    name: pontegames-api
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 0
      idle-timeout: 15000
      max-lifetime: 120000
      initialization-fail-timeout: 120000
      data-source-properties:
        oracle.jdbc.fanEnabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local}
      base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
      chat:
        options:
          model: ${OPENAI_MODEL:llama3.2}
          temperature: 0.2
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

pontegames:
  ia:
    url: ${IA_SERVICE_URL:https://ponte-games-ia-service.onrender.com/api/v1/ia/validar}
  fotos:
    diretorio: ${FOTOS_DIR:dados/fotos}
    tamanho-maximo-bytes: 5242880
  jwt:
    segredo: ${JWT_SECRET:pontegames-segredo-local-com-pelo-menos-32-bytes}
    expiracao-minutos: 120

server:
  port: ${PORT:8080}
